services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      DATABASE_PATH: /app/data/open-retro.sqlite
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - retro-data:/app/data
      - ./apps/api/src:/app/apps/api/src:ro
      - ./apps/api/tests:/app/apps/api/tests:ro
      - ./apps/api/migrations:/app/apps/api/migrations:ro
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/index.html:/app/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro

volumes:
  retro-data:
